spring.application.name=sme-cyber-risk-monitor
server.port=8085

# H2 Database with AUTO_SERVER=TRUE (In H2 2.x, AUTO_SERVER cannot be combined with DB_CLOSE_ON_EXIT=FALSE)
spring.datasource.url=jdbc:h2:file:./data/smedb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# SME Scanner Configuration
sme.scanner.socket-timeout-ms=1500
sme.scanner.http-timeout-ms=3500